<style>
/* M1 위험기상 종합상황도 — 전국을 약 10km 육각 격자로 나눠, 격자마다 가장 높은 단계 위험기상의 '색=종류, 진하기=단계'. 오른쪽은 위험기상 발생 현황 */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --ink:#0F172A; --muted:#64748B; --line:#E2E8F0; --land:#E3E7EA; --sea:#F7F9FA; --coast:#B7C1C9;
  --k-rain:#2A66D9; --k-wind:#8247D6; --k-heat:#DB4426; --k-cold:#159FBF; --k-wave:#0C8C73; --k-dust:#A8741A; --k-snow:#5A6FB0; --k-fog:#6E7C8C;
  --h0:#B9C2C9; --h1:#7FB4D4; --h2:#3F8FC0; --h3:#E3A132; --h4:#DB6229; --h5:#B42318; --c1:#6E9BEF; --c2:#2D50BF;
  --urgent:#C81E1E;
  --font-ui:Pretendard,"Malgun Gothic","Apple SD Gothic Neo","Segoe UI",system-ui,sans-serif; --font-num:"Cascadia Mono",Consolas,ui-monospace,"SF Mono",monospace; /* 글꼴은 사이트와 같게(2026-10-31) */
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#060A13; --surface:#0F1728; --ink:#E8EEF6; --muted:#8696AB; --line:#1E293A; --land:#1D262F; --sea:#121920; --coast:#33414D;
  --k-rain:#5B95FF; --k-wind:#AE82FF; --k-heat:#FF6E4F; --k-cold:#3FCBE6; --k-wave:#2FC7A3; --k-dust:#E3A93F; --k-snow:#A9B8F0; --k-fog:#B4C0CC;
  --h0:#3A4652; --h1:#3F8CB0; --h2:#4FAEDB; --h3:#F2B54C; --h4:#F47A45; --h5:#F2605B; --c1:#86A9F2; --c2:#B4C6FF; --urgent:#FF4D4D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#060A13; --surface:#0F1728; --ink:#E8EEF6; --muted:#8696AB; --line:#1E293A; --land:#1D262F; --sea:#121920; --coast:#33414D;
  --k-rain:#5B95FF; --k-wind:#AE82FF; --k-heat:#FF6E4F; --k-cold:#3FCBE6; --k-wave:#2FC7A3; --k-dust:#E3A93F; --k-snow:#A9B8F0; --k-fog:#B4C0CC;
  --h0:#3A4652; --h1:#3F8CB0; --h2:#4FAEDB; --h3:#F2B54C; --h4:#F47A45; --h5:#F2605B; --c1:#86A9F2; --c2:#B4C6FF; --urgent:#FF4D4D; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 30px}
.wrap{max-width:1640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--k-rain);outline-offset:2px}
.ic{width:15px;height:15px;flex:none}

.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

.top h1 svg{width:26px;height:26px}
.meta{font-size:12.5px;color:var(--muted);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.meta b{color:var(--ink);font-family:var(--font-num)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:32px;min-width:32px;padding:0 10px;cursor:pointer;color:var(--muted);display:inline-grid;place-items:center;font-size:12.5px}
.btn:hover{color:var(--ink);border-color:var(--ink)} .btn svg{width:16px;height:16px}
.btn.spin svg{animation:spin 1s linear infinite} @keyframes spin{to{transform:rotate(360deg)}}
.btn[aria-pressed="true"]{border-color:var(--c2);color:var(--c2);font-weight:700}
#theme .moon{display:none}
:root[data-theme="light"] #theme .sun{display:none} :root[data-theme="light"] #theme .moon{display:inline}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) #theme .sun{display:none} :root:not([data-theme="dark"]) #theme .moon{display:inline}}

/* 긴급 띠 */
.urgent{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;background:var(--urgent);color:#fff;border-radius:10px;padding:10px 14px;font-weight:600}
.urgent[hidden]{display:none}
.urgent .tag{background:#fff;color:var(--urgent);font-weight:800;border-radius:6px;padding:1px 8px;font-size:12.5px;animation:blink 1.4s steps(2,start) infinite}
@keyframes blink{50%{opacity:.35}}
.urgent span{display:inline-flex;gap:6px;align-items:center}
.note{font-size:12.5px;border:1px dashed var(--c2);color:var(--c2);border-radius:8px;padding:6px 12px;font-weight:600}
.note[hidden]{display:none}
.cut{border:1px solid var(--h4);background:color-mix(in srgb,var(--h4) 12%,var(--surface));color:var(--ink);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600}.cut[hidden]{display:none}

.main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;align-items:start}
.mapcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;position:relative}
#map{width:100%;height:calc(100vh - 150px);display:block;min-height:520px}
#map .sea{fill:var(--sea)} #map .land{fill:var(--land);stroke:var(--coast);stroke-width:.7}
.hex{stroke:none;cursor:pointer}
.hex.warn{stroke:var(--wc);stroke-width:1.6;stroke-dasharray:3 2}
.hex:hover{stroke:var(--ink);stroke-width:1.4}
.prov{font-size:12px;font-weight:800;fill:var(--muted);opacity:.75;text-anchor:middle;paint-order:stroke;stroke:var(--land);stroke-width:3px;pointer-events:none}
/* 겹친 칸 숫자 배지 + 펼침 꽃잎 */
.badge{cursor:pointer}
.badge circle{fill:var(--ink);stroke:var(--surface);stroke-width:1.4}
.badge text{fill:var(--surface);font-size:7.5px;font-weight:800;text-anchor:middle;font-family:var(--font-num)}
.badge:hover circle,.badge.on circle{fill:var(--urgent)}
.lgt{pointer-events:none} .lgt circle{fill:#F2B705;stroke:var(--surface);stroke-width:.6;opacity:.85} .lgt circle.fresh{fill:#FFD43B;stroke:var(--ink);stroke-width:.7;opacity:1}
.fan{pointer-events:none}
.fan .dim{fill:var(--bg);opacity:.38;animation:fade .3s ease-out both}
.fan .core{stroke:var(--ink);stroke-width:1.8}
@keyframes fade{from{opacity:0}to{opacity:.38}}
.fan .spoke{fill:none;stroke:var(--kc);stroke-width:1.4;stroke-dasharray:120;stroke-dashoffset:120;animation:draw .35s ease-out forwards;animation-delay:var(--d)}
.fan .petal{animation:pop .42s cubic-bezier(.2,1.5,.4,1) both;animation-delay:var(--d);transform-box:fill-box;transform-origin:center}
.fan .petal circle{fill:var(--kc);stroke:var(--surface);stroke-width:1.6}
.fan .card rect{fill:var(--surface);stroke:var(--kc);stroke-width:1.1}
.fan .card{animation:slide .35s ease-out both;animation-delay:calc(var(--d) + .12s)}
.fan .card .t1{font-size:9.5px;font-weight:800;fill:var(--kc)}
.fan .card .t2{font-size:7.6px;fill:var(--muted)}
.fan .card .v{font-family:var(--font-num);font-weight:700;fill:var(--ink)}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes slide{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.ring{fill:none;stroke:var(--urgent);stroke-width:2}
.ring.anim{animation:ripple 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ripple{from{transform:scale(.25);opacity:1}to{transform:scale(1.6);opacity:0}}
.evlab{font-size:13px;font-weight:800;fill:var(--urgent);paint-order:stroke;stroke:var(--surface);stroke-width:4px}
.trk{fill:none;stroke:var(--urgent);stroke-width:2.2}
.trk.fc{stroke-dasharray:5 4;opacity:.8}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);padding:6px 6px 2px}
.legend .k{display:inline-flex;gap:5px;align-items:center}
.legend .ramp{display:inline-flex;gap:2px;margin-left:4px} .legend .ramp i{width:12px;height:10px;border-radius:2px;background:var(--kc)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:7px 9px;border-radius:8px;max-width:260px;opacity:0;transition:opacity .1s;z-index:3;line-height:1.45}
.tip.on{opacity:1}

/* 오른쪽 */
.side{display:flex;flex-direction:column;gap:12px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.box h2{margin:0 0 8px;font-size:14px;font-weight:800;display:flex;justify-content:space-between;align-items:baseline}
.box h2 small{font-weight:400;color:var(--muted);font-size:12px}
.kinds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.kbtn{min-width:0} .kbtn b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .kbtn .num{white-space:nowrap}
.kbtn{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface);cursor:pointer;text-align:left;color:var(--kc)}
.kbtn b{color:var(--ink);font-size:13px} .kbtn .num{margin-left:auto;font-size:12px;color:var(--muted)}
.kbtn[aria-pressed="true"]{border-color:var(--kc);background:color-mix(in srgb,var(--kc) 14%,var(--surface));box-shadow:0 0 0 1px var(--kc) inset}
.kinds.some .kbtn[aria-pressed="false"]{opacity:.5}
.kbtn:disabled{cursor:default;opacity:.5;grid-column:1/-1} .kbtn:disabled .num{font-size:11px}
.kbtn[data-k="dust"],.kbtn[data-k="lightning"]{grid-column:1/-1} .kbtn.all{grid-column:1/-1;justify-content:center;color:var(--ink)} .kbtn.all b{font-weight:800}

.chips{display:flex;flex-wrap:wrap;gap:4px;margin:-2px 0 8px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:3px 9px 3px 7px;font-size:12px;background:var(--surface);color:var(--kc);cursor:pointer}
.chip span{color:var(--ink)} .chip .ic{width:13px;height:13px}
.chip[aria-pressed="true"]{border-color:var(--kc);background:color-mix(in srgb,var(--kc) 16%,var(--surface));font-weight:700}
.chip.all{color:var(--ink)} .chip.all[aria-pressed="true"]{--kc:var(--ink)}
.items .ev .dot{background:color-mix(in srgb,var(--urgent) 18%,transparent);color:var(--urgent)}
.items .ev .v{color:var(--urgent)}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;max-height:420px;overflow:auto}
.items li{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:7px 2px;border-top:1px solid var(--line);cursor:pointer}
.items li:first-child{border-top:0}
.items li:hover{background:color-mix(in srgb,var(--kc) 8%,transparent)}
.items .dot{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:color-mix(in srgb,var(--kc) calc(var(--lv) * 18%),transparent);color:var(--kc)}
.items .t b{display:block;font-size:13px} .items .t span{font-size:11.5px;color:var(--muted)}
.items .v{font-family:var(--font-num);font-weight:700;color:var(--kc);text-align:right;font-size:13px}
.items .v small{display:block;font-family:var(--font-ui);font-size:10.5px;font-weight:600}
.wl{margin:0;padding:0;list-style:none;font-size:12.5px}
.wl li{padding:4px 0;border-top:1px dotted var(--line)} .wl li:first-child{border-top:0}
.wl b{color:var(--wc)} .wl span{color:var(--muted)}
.src{font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.src i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--sc);margin-right:4px}
.empty{color:var(--muted);font-size:12.5px;margin:4px 0}
.foot{font-size:11.5px;color:var(--muted)}

@media (max-width:980px){.main{grid-template-columns:1fr}#map{height:auto;min-height:0}}
/* 확대·이동 */
.zoom{position:absolute;top:14px;right:14px;display:flex;flex-direction:column;gap:6px;z-index:4}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.fan .spoke{stroke-dashoffset:0}}
/* 사이트 왼쪽 탭(태양광 · 풍력, 2026-10-31 연구자): PC 왼쪽 세로 막대, 휴대폰 아래 탭 막대 */
.rail{position:fixed;left:0;top:0;bottom:0;width:76px;z-index:40;display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 0;background:var(--surface);border-right:1px solid var(--line)}

.rail a svg{width:24px;height:24px}.rail a:hover{color:var(--ink)}
.rail a.s.on{background:color-mix(in srgb,#E0A21B 16%,transparent);color:#E0A21B}.rail a.w.on{background:color-mix(in srgb,#46C2CB 16%,transparent);color:#46C2CB}.rail a.h.on{background:color-mix(in srgb,#E5533D 16%,transparent);color:#E5533D}.rail a.n.on{background:color-mix(in srgb,#5B4BFF 16%,transparent);color:#5B4BFF}.rail a.e:hover{color:#F59E0B}

    <aside class="side">
      <div class="box"><h2>위험기상 <small>중복 선택 가능</small></h2><div class="kinds" id="kinds"></div></div>
      <div class="box"><h2>위험기상 발생 현황 <small id="isub"></small></h2><div class="chips" id="chips" role="group" aria-label="위험기상 선택"></div><ul class="items" id="items"></ul></div>
      <div class="box"><h2>기상특보 <small id="wsub"></small></h2><ul class="wl" id="wl"></ul></div>
      <div class="box"><h2>자료 수신 현황</h2><div class="src" id="src"></div></div>
    </aside>
  </section>
  <footer class="foot"><span id="ops"></span> · 격자(약 10km 육각형) = 격자 내 관측지점 중 가장 높은 단계의 위험기상. 점선 테두리 = 특보 발효 시군(특보구역 명칭 기준 추정). 단계는 기상청 특보 기준을 참고한 표출용 구분.</footer>
</div>

<script>
/* 위험기상 감시 — 세 시안(A 관제 콘솔 · B 위험 매트릭스 · C 작은 지도)이 같이 쓰는 부분.
   make_hazard.py 가 각 템플릿의 COMMON 자리에 그대로 넣음. 화면 그리기는 각 템플릿이 함 */
const HZ = (() => {
  "use strict";
  const f1 = v => v == null ? "–" : v.toFixed(1);
  const DIRS = ["북","북북동","북동","동북동","동","동남동","남동","남남동","남","남남서","남서","서남서","서","서북서","북서","북북서"];
  const dirName = d => d == null ? "–" : DIRS[Math.round(d / 22.5) % 16];

  /* 감시 항목: 값 꺼내기, 단계 [문턱값, 이름, 색 토큰] — 낮을수록 위험한 항목은 low */
  const LAYERS = [
    { key: "rn60", name: "호우", what: "60분 강수", unit: "mm", src: "obs", get: o => o.rn60,
      steps: [[0.1, "약한 비", "h1"], [10, "강한 비", "h2"], [20, "매우 강한 비", "h3"], [30, "시간당 30mm↑", "h4"], [50, "시간당 50mm↑", "h5"]] },
    { key: "rnd", name: "일강수", what: "오늘 누적 강수", unit: "mm", src: "obs", get: o => o.rnd,
      steps: [[1, "비", "h1"], [30, "30mm↑", "h2"], [80, "80mm↑", "h3"], [110, "호우주의보급", "h4"], [180, "호우경보급", "h5"]] },
    { key: "wss", name: "강풍", what: "최대순간풍속", unit: "m/s", src: "obs", get: o => o.wss,
      steps: [[10, "다소 강함", "h1"], [14, "강함", "h2"], [17, "매우 강함", "h3"], [20, "강풍주의보급", "h4"], [26, "강풍경보급", "h5"]] },
    { key: "hot", name: "폭염", what: "기온", unit: "℃", src: "obs", get: o => o.ta,
      steps: [[28, "더움", "h1"], [30, "30℃↑", "h2"], [32, "32℃↑", "h3"], [33, "폭염주의보급", "h4"], [35, "폭염경보급", "h5"]] },
    { key: "cold", name: "한파", what: "기온(낮은 순)", unit: "℃", src: "obs", get: o => o.ta, low: true,
      steps: [[0, "영하", "c1"], [-5, "-5℃↓", "c2"], [-10, "-10℃↓", "h3"], [-12, "한파주의보급", "h4"], [-15, "한파경보급", "h5"]] },
    { key: "wave", name: "풍랑", what: "유의파고", unit: "m", src: "sea", get: o => o.wh,
      steps: [[1, "1 m↑", "h1"], [2, "2 m↑", "h2"], [2.5, "2.5 m↑", "h3"], [3, "풍랑주의보급", "h4"], [5, "풍랑경보급", "h5"]] }];
  /* PM10 1시간 평균: 나쁨 81↑ · 매우나쁨 151↑ · 미세먼지주의보 150↑ · 경보 300↑ · 황사경보 800↑ (특보는 2시간 지속 기준이라 '급'으로 표기) */
  const PM10 = { key: "pm10", name: "황사·미세먼지", what: "PM10 1시간 평균", unit: "㎍/㎥", src: "obs", get: o => o.pm10,
      steps: [[81, "나쁨", "h1"], [116, "나쁨(높음)", "h2"], [151, "매우나쁨·주의보급", "h3"], [300, "미세먼지경보급", "h4"], [800, "황사경보급", "h5"]] };   // 시안 A·B·C 의 항목 목록(LAYERS)에는 넣지 않음
  /* 오늘 신적설: 대설주의보 5cm·경보 20cm(24시간 신적설 기준이라 '급') */
  const SD = { key: "sd", name: "대설", what: "오늘 신적설", unit: "cm", src: "obs", get: o => o.sd,
      steps: [[0.5, "눈", "h1"], [1, "1cm↑", "h2"], [3, "3cm↑", "h3"], [5, "대설주의보급", "h4"], [20, "대설경보급", "h5"]] };
  /* 시정(ASOS 매시): 1km 미만이 안개 — 낮을수록 위험 */
  const VIS = { key: "vis", name: "안개", what: "시정", unit: "km", src: "obs", get: o => o.vis, low: true, show: v => v < 1 ? `${Math.round(v * 1000)}m` : `${v.toFixed(1)}km`,
      steps: [[2, "시정 2km↓", "h1"], [1, "안개(1km↓)", "h2"], [0.5, "짙은 안개(500m↓)", "h3"], [0.2, "매우 짙은 안개(200m↓)", "h4"], [0.1, "100m↓", "h5"]] };
  const layer = k => LAYERS.find(l => l.key === k) || ({ pm10: PM10, sd: SD, vis: VIS })[k] || LAYERS[0];
  const stepOf = (L, v) => { if (v == null) return null; let s = null; for (const st of L.steps) if (L.low ? v <= st[0] : v >= st[0]) s = st; return s; };
  const lvl = (L, v) => { const s = stepOf(L, v); return s ? L.steps.indexOf(s) + 1 : 0; };     // 0 평온 … 5 경보급
  const col = (L, v) => { const s = stepOf(L, v); return s ? `var(--${s[2]})` : "var(--h0)"; };
  const pool = (D, L) => (L.src === "sea" ? D.sea || [] : D.obs || []).filter(o => L.get(o) != null);
  const rank = (D, L, prov) => pool(D, L).filter(o => L.src === "sea" || !prov || prov === "전체" || o.prov === prov)
    .sort((a, b) => L.low ? L.get(a) - L.get(b) : L.get(b) - L.get(a));

  /* 도: 전남 → 전북 → 나머지는 지점 많은 순 */
  function provs(D) {
    const cnt = {}; for (const o of D.obs || []) cnt[o.prov] = (cnt[o.prov] || 0) + 1;
    const FIRST = ["전남", "전북"];
    return Object.keys(cnt).filter(p => p !== "기타").sort((a, b) => { const ia = FIRST.indexOf(a), ib = FIRST.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || cnt[b] - cnt[a]; });
  }

  /* 특보 */
  const wName = w => w.lvl === "예비" ? `${w.wrn} 예비특보` : `${w.wrn}${w.lvl === "경보" ? "경보" : "주의보"}`;
  const wCol = w => w.lvl === "예비" ? "var(--muted)" : w.lvl === "경보" ? "var(--h5)" : "var(--h4)";
  const tmTxt = t => t ? `${+t.slice(4, 6)}/${+t.slice(6, 8)} ${t.slice(8, 10)}:${t.slice(10, 12)}` : "–";
  function warnGroups(D) {
    const g = {}; for (const w of D.wrn || []) (g[wName(w)] ??= []).push(w);
    return Object.entries(g).sort((a, b) => (a[1][0].lvl === "예비") - (b[1][0].lvl === "예비")
      || (b[1][0].lvl === "경보") - (a[1][0].lvl === "경보") || b[1].length - a[1].length);
  }

  /* 연결 상태 */
  const SRC_ST = { ok: ["정상 수신", "var(--h2)"], wait: ["활용신청 대기", "var(--h3)"], fail: ["수신 실패", "var(--h5)"], key: ["인증키 필요(data.go.kr)", "var(--muted)"] };
  const LIVE = [["호우·강풍·폭염·한파", "AWS 1분 자료 nph-aws2_min"], ["풍랑", "해상관측 sea_obs.php"], ["기상특보", "wrn_now_data.php"]];
  const sources = D => [...LIVE.map(([n, a]) => ({ name: n, api: a, st: SRC_ST.ok })),
                        ...(D.sources || []).map(s => ({ name: s.name, api: s.api, st: SRC_ST[s.state] || SRC_ST.wait }))];

  /* 가상 상황(시안 검토용): 전남 내륙에 강한 비, 제주에 강풍, 남쪽 바다에 높은 파고 — 실제 관측이 아님 */
  function demo(D0) {
    const D = JSON.parse(JSON.stringify(D0)); D.demo = true;
    const cen = p => { const s = D.obs.filter(o => o.prov === p); return s.length ? [s.reduce((a, o) => a + o.x, 0) / s.length, s.reduce((a, o) => a + o.y, 0) / s.length] : [0, 0]; };
    const bump = (o, c, r) => Math.exp(-((o.x - c[0]) ** 2 + (o.y - c[1]) ** 2) / (2 * r * r));
    const rain = cen("전남"), jeju = cen("제주"), rain2 = cen("경남");
    for (const o of D.obs) {
      const r = 52 * bump(o, [rain[0] + 10, rain[1] - 25], 38) + 24 * bump(o, rain2, 30);
      if (r > 0.3) { o.rn60 = +r.toFixed(1); o.rn15 = +(r / 3).toFixed(1); o.rnd = +(r * 3.4).toFixed(1); }
      const w = 29 * bump(o, jeju, 40);
      if (o.wss != null && w > o.wss) { o.wss = +w.toFixed(1); o.ws = +(w * 0.62).toFixed(1); o.wd = 320; }
    }
    for (const s of D.sea || []) { const h = 5.6 * bump(s, [jeju[0], jeju[1] + 10], 70); if (s.wh != null && h > s.wh) s.wh = +h.toFixed(1); }
    D.events = { quake: { lat: 35.77, lon: 129.19, mag: 4.3, depth: 12, place: "경북 경주시 남남서쪽 9km", tm: "15:02" },
                 typhoon: { name: "태풍 가상", track: [
                   { lat: 31.0, lon: 126.4, tm: "어제 21시", pres: 965, ws: 37 }, { lat: 32.0, lon: 126.9, tm: "오늘 09시", pres: 970, ws: 35 },
                   { lat: 32.8, lon: 127.5, tm: "지금", pres: 975, ws: 33, now: true },
                   { lat: 34.0, lon: 128.4, tm: "+12시간", pres: 982, ws: 29, fc: true }, { lat: 35.4, lon: 129.7, tm: "+24시간", pres: 990, ws: 24, fc: true }] } };
    D.events.typhoon.track.forEach(p => { if (!p.now && !p.fc) p.past = true; });
    D.wrn = [...(D.wrn || []),
      { up: "", regId: "Ldemo1", reg: "광주", tmFc: "", tmEf: "", wrn: "호우", lvl: "경보", ed: "" },
      { up: "", regId: "Ldemo2", reg: "나주 화순 담양", tmFc: "", tmEf: "", wrn: "호우", lvl: "주의", ed: "" },
      { up: "", regId: "Ldemo3", reg: "제주도산지", tmFc: "", tmEf: "", wrn: "강풍", lvl: "경보", ed: "" }];
    return D;
  }

  /* ---- 큰 지도 한 장에 모든 위험을 겹쳐 보기 위한 것 (시안 M1·M2·M3) ---- */
  /* 위험 종류: 호우는 60분·일강수 중 높은 단계. 색 토큰 --k-rain 등은 각 템플릿이 정함 */
  const KINDS = [
    { key: "rain", name: "호우", layers: ["rn60", "rnd"], tok: "k-rain" },
    { key: "wind", name: "강풍", layers: ["wss"], tok: "k-wind" },
    { key: "heat", name: "폭염", layers: ["hot"], tok: "k-heat" },
    { key: "cold", name: "한파", layers: ["cold"], tok: "k-cold" },
    { key: "wave", name: "풍랑", layers: ["wave"], tok: "k-wave" }];
  /* 지점 하나의 종류별 단계와 가장 높은 위험 {kind, lvl, L, v} — 단계 0 이면 kind 없음 */
  /* 황사·미세먼지 — 쓰는 템플릿만 hazards(o, sea, [...KINDS, DUST]) 로 넘김 */
  const DUST = { key: "dust", name: "황사·미세먼지", layers: ["pm10"], tok: "k-dust" };
  const SNOW = { key: "snow", name: "대설", layers: ["sd"], tok: "k-snow" };
  const FOG = { key: "fog", name: "안개", layers: ["vis"], tok: "k-fog" };
  function hazards(o, sea, kinds = KINDS) {
    const out = [];
    for (const k of kinds) { if ((k.key === "wave") !== !!sea) continue;
      let best = null; for (const lk of k.layers) { const L = layer(lk), v = L.get(o), lv = lvl(L, v); if (lv && (!best || lv > best.lvl)) best = { kind: k, lvl: lv, L, v }; }
      if (best) out.push(best); }
    return out.sort((a, b) => b.lvl - a.lvl);
  }
  const worst = (o, sea) => hazards(o, sea)[0] || null;
  const val = (L, v) => L.show && v != null ? L.show(v) : `${f1(v)}${L.unit}`;   // 값+단위(시정은 1km 미만이면 m)
  const fmt = h => `${h.kind.name} ${val(h.L, h.v)}`;

  /* 육상 특보구역 ↔ 지점: 구역 이름이 지점 시군·이름과 겹치면 그 지점에 걸린 특보로 봄(이름 기준 추정) */
  function warnStations(D) {
    const m = {};
    for (const w of D.wrn || []) {
      if (/바다|해상|먼바다|앞바다/.test(w.reg)) continue;
      const keys = w.reg.replace(/[()·.,]/g, " ").split(/\s+/).map(t => t.replace(/(시|군|구|산지|평지|북부|남부|동부|서부|중부)$/, ""))
        .flatMap(t => [t, t.replace(/도$/, "")]).filter(t => t.length >= 2);   // '제주도산지' → 제주도 → 제주
      const METRO = ["서울", "부산", "대구", "인천", "광주", "대전", "울산", "세종"];   // 광역시 이름은 같은 이름의 시군(경기 광주시 등)과 헷갈리지 않게 지점 이름·도로만
      const hit = o => keys.some(k => METRO.includes(k) ? (o.prov === k || o.name.startsWith(k)) : ((o.sgg && o.sgg.startsWith(k)) || o.name.startsWith(k)));
      for (const o of D.obs || []) if (hit(o)) (m[o.id] ??= []).push(w);
    }
    return m;
  }

  /* 위경도 → 지도 좌표 (수집 때 쓴 투영 그대로) */
  const proj = (D, lat, lon) => { const p = D.map.proj; return p ? [(lon - p.lon0) * p.kx * p.sx, (p.lat1 - lat) * p.sx] : [0, 0]; };
  /* 사건(태풍 경로 등)이 지도 밖이면 보이도록 넓힌 viewBox [x, y, w, h] */
  function viewBox(D, pad = 24) {
    const { w, h } = D.map, E = D.events || {}, P = [];
    if (E.quake) P.push(proj(D, E.quake.lat, E.quake.lon));
    if (E.typhoon) for (const p of E.typhoon.track) P.push(proj(D, p.lat, p.lon));
    let x0 = 0, y0 = 0, x1 = w, y1 = h;
    const M = 110;                                                       // 넓혀도 한 방향 최대 약 0.8도 — 더 먼 곳은 잘림(한반도가 작아지지 않게)
    for (const [x, y] of P.filter(([x, y]) => x > -M && y > -M && x < w + M && y < h + M)) { x0 = Math.min(x0, x - pad); y0 = Math.min(y0, y - pad); x1 = Math.max(x1, x + pad + 60); y1 = Math.max(y1, y + pad); }
    x0 = Math.max(x0, -M); y0 = Math.max(y0, -M); x1 = Math.min(x1, w + M); y1 = Math.min(y1, h + M);
    return [x0, y0, x1 - x0, y1 - y0];
  }
  /* 도 이름표 자리(지점 평균) */
  function provCenters(D) {
    const c = {}; for (const o of D.obs || []) { const a = (c[o.prov] ??= { x: 0, y: 0, n: 0 }); a.x += o.x; a.y += o.y; a.n++; }
    for (const k in c) { c[k].x /= c[k].n; c[k].y /= c[k].n; } return c;
  }
  /* 긴급(즉시 알릴) 상황: 지진·태풍·해일 */
  function urgent(D) {
    const E = D.events || {}, u = [];
    if (E.quake) u.push({ kind: "지진", text: `규모 ${E.quake.mag.toFixed(1)} ${E.quake.place} (${E.quake.tm})`, at: proj(D, E.quake.lat, E.quake.lon) });
    if (E.typhoon && E.typhoon.eff !== 4) { const t = E.typhoon, now = t.track.find(p => p.now) || t.track.filter(p => !p.fc).at(-1) || t.track[0];
      u.push({ kind: "태풍", text: `${t.name} — 중심기압 ${now.pres}hPa, 최대풍속 ${now.ws} m/s, ${now.tm}`, at: proj(D, now.lat, now.lon) }); }
    for (const w of D.wrn || []) if (/해일|태풍/.test(w.wrn) && w.lvl !== "예비") u.push({ kind: w.wrn, text: `${wName(w)} ${w.reg}` });
    return u;
  }

  /* 아이콘(16×16, 선) — 위험 종류·사건 */
  const ICON = {
    rain: "M8 2C8 2 3.5 7.2 3.5 10a4.5 4.5 0 0 0 9 0C12.5 7.2 8 2 8 2Z",
    wind: "M2 6h8a2 2 0 1 0-2-2M2 10h11a2 2 0 1 1-2 2M2 8h6",
    heat: "M8 2a1.6 1.6 0 0 0-1.6 1.6v6.2a3 3 0 1 0 3.2 0V3.6A1.6 1.6 0 0 0 8 2Z",
    cold: "M8 1.5v13M2.4 4.75l11.2 6.5M2.4 11.25l11.2-6.5",
    wave: "M1.5 8c1.6 0 1.6-2 3.2-2s1.6 2 3.3 2 1.6-2 3.2-2 1.6 2 3.3 2M1.5 12c1.6 0 1.6-2 3.2-2s1.6 2 3.3 2 1.6-2 3.2-2 1.6 2 3.3 2",
    quake: "M1 8h3l1.5-4 3 8 2-6 1.5 2H15",
    typhoon: "M6 8a2 2 0 1 0 4 0a2 2 0 1 0-4 0M8 2a6 6 0 0 1 6 6M8 14a6 6 0 0 1-6-6",
    dust: "M3 5h.01M8 3.5h.01M13 5.5h.01M5.5 8.5h.01M10.5 8h.01M3 12h.01M8 11.5h.01M13 12.5h.01",
    lightning: "M9.5 1.5 4 9h4l-1.5 5.5L12 7H8z",
    fog: "M2 5h12M3.5 8h9M2 11h12M5 14h6",
    snow: "M8 1.5v13M2.4 4.8l11.2 6.4M2.4 11.2l11.2-6.4M6.3 2.8 8 4.4l1.7-1.6M6.3 13.2 8 11.6l1.7 1.6" };

  const side = c.cx + 200 > base[0] + base[2] ? -1 : 1;
  animTo([side > 0 ? c.cx - w * 0.09 : c.cx - w * 0.91, c.cy - h * 0.5, w, h], () => { pinned = key; openFan(c, true); });
}
$("#zin").onclick = e => { e.stopPropagation(); animTo(zoomAt(cur[0] + cur[2] / 2, cur[1] + cur[3] / 2, 1.7)); };
$("#zout").onclick = e => { e.stopPropagation(); animTo(zoomAt(cur[0] + cur[2] / 2, cur[1] + cur[3] / 2, 1 / 1.7)); };
$("#zall").onclick = e => { e.stopPropagation(); pinned = null; openKey = null; if (fanLayer) fanLayer.innerHTML = ""; animTo(base); };
/* 끌기(한 손가락·마우스)와 벌리기(두 손가락) — 확대했을 때만. 끌고 난 뒤 손을 떼면 그 '누름'은 무시 */
(() => {
  const m = $("#map"), P = new Map(); let start = null, moved = false;
  const unit = () => cur[2] / m.getBoundingClientRect().width;
  m.addEventListener("pointerdown", e => { if (!m.classList.contains("zoomed")) return; P.set(e.pointerId, [e.clientX, e.clientY]);
    start = { vb: cur.slice(), pts: [...P.values()].map(p => p.slice()) }; moved = false; });
  m.addEventListener("pointermove", e => { if (!P.has(e.pointerId) || !start) return; P.set(e.pointerId, [e.clientX, e.clientY]);
    const pts = [...P.values()], u = unit();
    if (pts.length === 1 && start.pts.length === 1) { const dx = pts[0][0] - start.pts[0][0], dy = pts[0][1] - start.pts[0][1];
      if (!moved && Math.hypot(dx, dy) < 6) return; moved = true; m.classList.add("drag");
      setVB(clampVB([start.vb[0] - dx * u, start.vb[1] - dy * u, start.vb[2], start.vb[3]])); }
    else if (pts.length === 2 && start.pts.length === 2) { moved = true;
      const d0 = Math.hypot(start.pts[0][0] - start.pts[1][0], start.pts[0][1] - start.pts[1][1]), d1 = Math.hypot(pts[0][0] - pts[1][0], pts[0][1] - pts[1][1]);
      const r = m.getBoundingClientRect(), mx = (pts[0][0] + pts[1][0]) / 2 - r.left, my = (pts[0][1] + pts[1][1]) / 2 - r.top;
      const f = d1 / (d0 || 1), w = start.vb[2] / f, h = start.vb[3] / f, ax = start.vb[0] + mx * start.vb[2] / r.width, ay = start.vb[1] + my * start.vb[3] / r.height;
      setVB(clampVB([ax - mx * w / r.width, ay - my * h / r.height, w, h])); } });
  const end = e => { P.delete(e.pointerId); m.classList.remove("drag"); if (!P.size) start = null; else start = { vb: cur.slice(), pts: [...P.values()].map(p => p.slice()) }; };
  m.addEventListener("pointerup", end); m.addEventListener("pointercancel", end);
  m.addEventListener("click", e => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
})();

function tipOn(e, c) {
  const box = $(".mapcard").getBoundingClientRect(), t = $("#tip");
  const rows = c.st.filter(s => s.hs.length).sort((a, b) => b.hs[0].lvl - a.hs[0].lvl).slice(0, 4);
  t.innerHTML = (rows.length ? rows.map(s => `<b>${s.o.name}</b> ${s.hs.map(fmt).join(" · ")}`).join("<br>") : `${c.st.slice(0, 3).map(s => s.o.name).join(", ")} — 평온`)
    + (c.warn.length ? `<br>특보: ${[...new Set(c.warn.map(HZ.wName))].join(", ")}` : "");
  t.style.left = Math.min(e.clientX - box.left + 14, box.width - 270) + "px"; t.style.top = (e.clientY - box.top + 14) + "px"; t.classList.add("on");
}
function tipOff() { $("#tip").classList.remove("on"); }

function renderRail() {
  const all = [...(D.obs || []).map(o => ({ o, hs: hazards(o, false) })), ...(D.sea || []).map(o => ({ o, hs: hazards(o, true) }))];
  const E = D.events || {}, ST = Object.fromEntries((D.sources || []).map(x => [x.key, x.state]));
  const ex = EXTRA.map(x => ({ ...x, n: x.key === "quake" ? (E.quake ? 1 : 0) : x.key === "typhoon" ? (E.typhoons || (E.typhoon ? [1] : [])).length : (E.lightning || []).length,
    ok: ST[x.src] === "ok" || !!E[x.key], wait: "신청 대기" }));
  const kindN = k => all.filter(a => a.hs.some(h => h.kind === k && h.lvl >= 3)).length;
  $("#kinds").className = "kinds" + (sel.size ? " some" : "");
  $("#kinds").innerHTML = `<button class="kbtn all" data-k="all" aria-pressed="${!sel.size}"><b>전체 보기</b></button>`
    + KINDS.map(k => `<button class="kbtn" data-k="${k.key}" aria-pressed="${sel.has(k.key)}" style="--kc:${kc(k)}">${icon(k.key)}<b>${k.name}</b><span class="num">${kindN(k)}개소</span></button>`).join("")
    + ex.map(x => `<button class="kbtn" data-k="${x.key}" aria-pressed="${sel.has(x.key)}" style="--kc:var(--urgent)" ${x.ok ? "" : "disabled"} title="${x.ok ? "" : "활용신청 승인 후 표출"}">${icon(x.key)}<b>${x.name}</b><span class="num">${x.ok ? `${x.n}건` : x.wait}</span></button>`).join("");
  $("#kinds").querySelectorAll(".kbtn:not(:disabled)").forEach(b => b.onclick = e => { e.stopPropagation(); toggle(b.dataset.k); });
  // 발생 현황 위 칩(위 선택과 같은 상태)
  $("#chips").innerHTML = `<button class="chip all" data-k="all" aria-pressed="${!sel.size}">전체</button>`
    + KINDS.filter(k => kindN(k) || sel.has(k.key)).map(k => `<button class="chip" data-k="${k.key}" aria-pressed="${sel.has(k.key)}" style="--kc:${kc(k)}">${icon(k.key)}<span>${k.name}</span></button>`).join("")
    + ex.filter(x => x.ok && (x.n || sel.has(x.key))).map(x => `<button class="chip" data-k="${x.key}" aria-pressed="${sel.has(x.key)}" style="--kc:var(--urgent)">${icon(x.key)}<span>${x.name}</span></button>`).join("");
  $("#chips").querySelectorAll(".chip").forEach(b => b.onclick = e => { e.stopPropagation(); toggle(b.dataset.k); });
  // 지진·태풍(긴급)은 맨 위
  const evs = [];
  if (E.quake && shown("quake")) evs.push(`<li class="ev"><span class="dot">${icon("quake")}</span><span class="t"><b>지진 규모 ${E.quake.mag.toFixed(1)}</b><span>${E.quake.place} · ${E.quake.tm}</span></span><span class="v">M${E.quake.mag.toFixed(1)}<small>긴급</small></span></li>`);
  if (E.typhoon && shown("typhoon")) { const t = E.typhoon.track.find(p => p.now) || E.typhoon.track.at(-1);
    const EFF = { 1: "한반도 상륙", 2: "한반도 직접영향", 3: "한반도 간접영향", 4: "한반도 영향 없음" };
    evs.push(`<li class="ev"><span class="dot">${icon("typhoon")}</span><span class="t"><b>${E.typhoon.name}</b><span>${EFF[E.typhoon.eff] ? EFF[E.typhoon.eff] + " · " : ""}중심기압 ${t.pres}hPa · ${t.tm}</span></span><span class="v">${t.ws}m/s<small>최대풍속</small></span></li>`); }
  if (E.lightning && E.lightning.length && shown("lightning")) { const L = E.lightning, mx = Math.max(...L.map(p => p[2]));
    evs.push(`<li class="ev"><span class="dot">${icon("lightning")}</span><span class="t"><b>낙뢰 ${L.length.toLocaleString()}회</b><span>최근 1시간 · 마지막 ${L.reduce((m, p) => p[3] > m ? p[3] : m, "00:00")}</span></span><span class="v">${mx}kA<small>최대 강도</small></span></li>`); }
  // 시군(또는 해상 지점)마다 가장 센 것 하나 → 단계 높은 순
  const by = new Map();
  for (const a of all) { const h = a.hs.find(h => shown(h.kind.key)); if (!h || h.lvl < 2) continue;
    const key = a.o.prov ? `${a.o.prov} ${a.o.sgg || a.o.name}` : `해상 ${a.o.name}`, cur = by.get(key);
    if (!cur || h.lvl > cur.h.lvl || (h.lvl === cur.h.lvl && Math.abs(h.v) > Math.abs(cur.h.v))) by.set(key, { key, o: a.o, h }); }
  const list = [...by.values()].sort((a, b) => b.h.lvl - a.h.lvl || Math.abs(b.h.v) - Math.abs(a.h.v)).slice(0, 25);
  $("#isub").textContent = `${list.length}개소 · 2단계 이상`;
  $("#items").innerHTML = evs.join("") + (list.length ? list.map(x => `<li style="--kc:${kc(x.h.kind)};--lv:${x.h.lvl}" data-x="${x.o.x}" data-y="${x.o.y}"><span class="dot">${icon(x.h.kind.key)}</span>
    <span class="t"><b>${x.key}</b><span>${x.o.name} · ${x.h.L.what}</span></span><span class="v">${HZ.val(x.h.L, x.h.v)}<small>${HZ.stepOf(x.h.L, x.h.v)[1]}</small></span></li>`).join("")
    : `<li style="display:block;cursor:default"><p class="empty">${sel.size ? "선택한 위험기상 중 2단계 이상이 없습니다." : "2단계 이상 위험기상이 없습니다(전국 평온)."}</p></li>`);
  const G = warnGroups(D), on = (D.wrn || []).filter(w => w.lvl !== "예비").length;
  $("#wsub").textContent = (D.wrn || []).length ? `발효 ${on} · 예비 ${(D.wrn || []).length - on}` : "";
  $("#wl").innerHTML = G.length ? G.map(([k, g]) => `<li style="--wc:${wCol(g[0])}"><b>${k}</b> <span>${g.map(w => w.reg).join(", ")}</span></li>`).join("") : `<li><span>발효 중인 특보 없음</span></li>`;
  $("#src").innerHTML = sources(D).map(s => `<span style="--sc:${s.st[1]}"><i></i>${s.name} ${s.st[0]}</span>`).join("");
}
function renderUrgent() {
  const U = urgent(D), b = $("#urgent"); b.hidden = !U.length;
  b.innerHTML = `<span class="tag">긴급</span>` + U.map(u => `<span>${icon(u.kind === "지진" ? "quake" : "typhoon")}<b>${u.kind}</b> ${u.text}</span>`).join("");
}
function cutShow() {
  const age = REAL && REAL.made ? (Date.now() - new Date(REAL.made + "+09:00")) / 60e3 : null, b = $("#cut");
  b.hidden = !(age > CUT_MIN); if (!b.hidden) b.textContent = `자료 끊김 추정 · 마지막 수집 ${REAL.made.slice(5, 16).replace("T", " ")} (${Math.round(age)}분 전). 지금 보이는 값은 오래된 값입니다.`;
}
setInterval(() => REAL && cutShow(), 60e3);
function render() {
  if (!D) return; cutShow();
  $("#obsT").textContent = HZ.obsTime(D); $("#ops").textContent = HZ.opsLine(D); $("#dnote").hidden = !demoOn;
  renderUrgent(); renderMap(); renderRail();
}
$("#demo").onclick = () => { demoOn = !demoOn; $("#demo").setAttribute("aria-pressed", demoOn); D = demoOn ? HZ.demo(REAL) : REAL; render(); };
HZ.themeButton($("#theme"));
HZ.autoRefresh($("#refresh"), $("#cd"), j => { REAL = j; D = demoOn ? HZ.demo(j) : j; render(); });
render();
})();
</script>
