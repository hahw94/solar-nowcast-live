<title>관제 근무노트 · Solar Nowcast</title>
<style>
/* 근무노트 로그인 문(2026-10-31 연구자): 자료 없음, 로그인은 오라클 서버로 바로 */
:root{--bg:#F4F6FA;--surface:#FFFFFF;--ink:#0F172A;--muted:#64748B;--line:#E2E8F0;--acc:#5B4BFF;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060A13;--surface:#0F1728;--ink:#E8EEF6;--muted:#8696AB;--line:#1E293A;--acc:#8B80FF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#060A13;--surface:#0F1728;--ink:#E8EEF6;--muted:#8696AB;--line:#1E293A;--acc:#8B80FF;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.5 Pretendard,"Malgun Gothic","Apple SD Gothic Neo","Segoe UI",system-ui,sans-serif;padding:16px;display:grid;place-items:center}
.card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 24px}
h1{margin:0 0 4px;font-size:21px;display:flex;align-items:center;gap:8px}h1 svg{width:26px;height:26px;color:var(--acc)}
p.sub{margin:0 0 18px;color:var(--muted);font-size:13.5px}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}
input{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;background:var(--bg);color:var(--ink)}
input:focus{outline:2px solid var(--acc);outline-offset:1px}
button{width:100%;height:46px;margin-top:18px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.alt{margin-top:16px;text-align:center;font-size:13.5px;color:var(--muted)}.alt a{color:var(--acc);font-weight:700}
.note{margin-top:14px;font-size:12px;color:var(--muted);line-height:1.5}
/* 사이트 왼쪽 탭(태양광 · 풍력, 2026-10-31 연구자): PC 왼쪽 세로 막대, 휴대폰 아래 탭 막대 */
.rail{position:fixed;left:0;top:0;bottom:0;width:76px;z-index:40;display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 0;background:var(--surface);border-right:1px solid var(--line)}
.rail a{width:62px;padding:10px 0 8px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);text-decoration:none;font:700 11.5px/1.2 system-ui,"Malgun Gothic",sans-serif}
.rail a svg{width:24px;height:24px}.rail a:hover{color:var(--ink)}
.rail a.s.on{background:color-mix(in srgb,#E0A21B 16%,transparent);color:#E0A21B}.rail a.w.on{background:color-mix(in srgb,#46C2CB 16%,transparent);color:#46C2CB}.rail a.h.on{background:color-mix(in srgb,#E5533D 16%,transparent);color:#E5533D}.rail a.n.on{background:color-mix(in srgb,#5B4BFF 16%,transparent);color:#5B4BFF}.rail a.e:hover{color:#F59E0B}
body{padding-left:92px!important}
@media (max-width:760px){body{padding-left:max(12px,env(safe-area-inset-left,0px))!important;padding-bottom:76px!important}.rail{top:auto;right:0;width:auto;height:60px;flex-direction:row;justify-content:center;gap:4px;padding:0 6px env(safe-area-inset-bottom,0px);border-right:0;border-top:1px solid var(--line)}.rail a{flex:1;max-width:170px;flex-direction:column;justify-content:center;gap:2px;font-size:11.5px;white-space:nowrap;padding:6px 0}.rail a svg{width:21px;height:21px}}
</style>
